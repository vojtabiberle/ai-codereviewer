name: "ai-codereviewer"
description: "Advanced AI-powered code reviews with multiple model support"
inputs:
  GITHUB_TOKEN:
    description: "GitHub token"
    required: true
  REVIEWER_ID:
    description: "Identity written into the hidden review marker. Distinguishes this workflow from others that post as the same bot. Defaults to GITHUB_WORKFLOW/GITHUB_JOB when empty. Not read from repository YAML."
    required: false
  AI_PROVIDER:
    description: "AI provider (openai, anthropic, google)"
    required: true
    default: "openai"
  AI_MODEL:
    description: "AI model to use"
    required: true
  AI_API_KEY:
    description: "API key for the chosen AI provider"
    required: true
  AI_BASE_URL:
    description: "Optional base URL for the OpenAI-compatible endpoint. Use this to route the openai provider at GitHub Models (https://models.github.ai/inference) or any other OpenAI-compatible gateway. Has no effect on the anthropic or google providers."
    required: false
  AI_TEMPERATURE:
    description: "Temperature for AI model (higher values = more creativity and variance)"
    required: false
    default: "0"
  APPROVE_REVIEWS:
    description: "Allow AI approvals. Blocker comments may still request changes when false."
    required: false
    default: "false"
  APPROVE_CONFIDENCE_THRESHOLD:
    description: "Minimum AI confidence (0-100) required to auto-approve. Below this, an 'approve' verdict is downgraded to 'comment'."
    required: false
    default: "80"
  MAX_COMMENTS:
    description: "Maximum number of review comments"
    required: false
    default: "0"
  MIN_COMMENT_SEVERITY:
    description: "Minimum severity to keep (blocker, major, minor, nit)"
    required: false
    default: "minor"
  PROJECT_CONTEXT:
    description: "Additional context about the project (inline string)."
    required: false
  PROJECT_CONTEXT_FILE:
    description: "Path (in the trusted PR base commit) to a file containing the project context. When set and present, takes precedence over PROJECT_CONTEXT. Skipped silently if missing."
    required: false
  INSTRUCTIONS_FILE:
    description: "Path (in the trusted PR base commit) to a Markdown file with repo-specific reviewer instructions. Skipped silently if missing. Combined with INSTRUCTIONS_URL when both are set (URL first as baseline, file appended as repo-specific override)."
    required: false
    default: ".github/ai-review.md"
  INSTRUCTIONS_URL:
    description: "URL to a Markdown file with shared reviewer instructions (e.g. raw.githubusercontent.com URL of a central org-wide config). Lets many repos share one source of truth without per-repo PRs."
    required: false
  INSTRUCTIONS_URL_TOKEN:
    description: "Optional bearer token for INSTRUCTIONS_URL when the source requires authentication (private GitHub raw URLs, etc.). Sent as 'Authorization: Bearer <token>'."
    required: false
  CONTEXT_FILES:
    description: "Comma-separated list of files (paths from repo root) to fetch and include alongside the diff so the model has project shape (manifests, READMEs, schemas). Empty by default — set per consumer or via .github/ai-review.yml's context_files."
    required: false
    default: ""
  EXCLUDE_PATTERNS:
    description: "Files to exclude (glob patterns)"
    required: false
    default: "**/*.lock,**/*.json,**/*.md"
  CONFIG_FILE:
    description: "Path (in the trusted PR base commit) to a YAML file whose top-level keys override action inputs for this repo. Useful when the action runs from an org-level Required Workflow and individual repos need to tune knobs without editing the central workflow. Skipped silently if missing."
    required: false
    default: ".github/ai-review.yml"
  AGENTIC_REVIEW:
    description: "When true, the model can call read_file(path) during the review to fetch any file from the PR head — useful in large repos where the diff alone isn't enough. Adds latency and cost (multiple model turns). Default false."
    required: false
    default: "false"
  AGENTIC_MAX_FILES:
    description: "Per-session cap on distinct (path, range) reads the model may make during an agentic review. Ignored when AGENTIC_REVIEW is false."
    required: false
    default: "20"
  AGENTIC_MAX_BYTES_PER_FILE:
    description: "Per-read byte cap for read_file during an agentic review. Larger payloads are truncated. Ignored when AGENTIC_REVIEW is false."
    required: false
    default: "20000"
  AGENTIC_MAX_TURNS:
    description: "Maximum number of model turns in the agentic loop before the session is forced to end. Ignored when AGENTIC_REVIEW is false."
    required: false
    default: "10"
  AGENTIC_MAX_TOTAL_BYTES:
    description: "Total UTF-8 output byte budget for all agentic read_file calls. Repository configuration can only lower this limit."
    default: "200000"
  MAX_INPUT_BYTES:
    description: "Maximum UTF-8 size of the initial system prompt and user payload. Oversized reviews fail before calling the model."
    default: "1000000"
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: "code"
  color: "purple"
