name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Opt in using repository variables and your own API secret.
    if: >-
      vars.AI_REVIEW_ENABLED == 'true'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          APPROVE_REVIEWS: 'false'
          AGENTIC_REVIEW: 'false'
          MAX_COMMENTS: '5'
          EXCLUDE_PATTERNS: '**/*.lock,dist/**'
